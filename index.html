<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Tidy</title>
  <meta name="description" content="Take a photo of any recipe and get a clean, easy to read recipe card. Keeps all your recipes in one place.">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#c2552d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recipes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="backBtn" hidden><span aria-hidden="true">‹</span> <span id="backLabel">My recipes</span></button>
    <a class="brand" href="#" id="brand"><img class="logo" src="icons/icon-192.png" alt=""> My Recipes</a>
    <button class="settings-btn" id="settingsBtn"><span aria-hidden="true">⚙️</span> Settings</button>
  </header>

  <main id="app" class="app"></main>

  <!-- Hidden pickers the big buttons open -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.html,.htm,.json,.rtf,image/*" multiple hidden>
  <input type="file" id="restoreInput" accept=".json,application/json" hidden>

  <!-- Full screen messages: working / done / problem / questions -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card" id="overlayCard" role="dialog" aria-modal="true" aria-live="polite"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/parser.js"></script>
  <script src="js/extract.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
